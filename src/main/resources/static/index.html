<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f4f7fb;
            padding: 40px;
        }

        .container{
            max-width: 1100px;
            margin: auto;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .form-box{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-bottom:30px;
        }

        input{
            flex:1;
            min-width:200px;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
        }

        button{
            padding:12px 20px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        .add-btn{
            background:#28a745;
            color:white;
        }

        .refresh-btn{
            background:#007bff;
            color:white;
        }

        .delete-btn{
            background:#dc3545;
            color:white;
            padding:8px 12px;
        }

        .table-box{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th, td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        th{
            background:#007bff;
            color:white;
        }

        tr:hover{
            background:#f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <div class="form-box">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email">
        <input type="text" id="course" placeholder="Enter Course">

        <button class="add-btn" onclick="addStudent()">Add Student</button>
        <button class="refresh-btn" onclick="getStudents()">Refresh</button>
    </div>

    <div class="table-box">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Course</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>
</div>

<script>
    const api = "http://localhost:8080/students";

    async function addStudent() {
        const student = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            course: document.getElementById("course").value
        };

        await fetch(api, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(student)
        });

        document.getElementById("name").value="";
        document.getElementById("email").value="";
        document.getElementById("course").value="";

        getStudents();
    }

    async function getStudents() {
        const response = await fetch(api);
        const students = await response.json();

        let rows = "";
        students.forEach(s => {
            rows += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.email}</td>
                    <td>${s.course}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteStudent(${s.id})">Delete</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById("studentTable").innerHTML = rows;
    }

    async function deleteStudent(id) {
        await fetch(api + "/" + id, {
            method: "DELETE"
        });

        getStudents();
    }

    getStudents();
</script>

</body>
</html>
